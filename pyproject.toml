[project]
name = "loop"
version = "0.1.0"
description = "Loop — a terminal-first, AI-driven personal command centre (local-first, cloud-optional)."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Gleb", email = "me@artdaw.com" }]
keywords = ["assistant", "agent", "llm", "ollama", "productivity"]

dependencies = [
    # Agent framework + LLMs (specification 1.3 requires LangChain/LangGraph 1.x)
    "langchain>=1.4",
    "langgraph>=1.2",
    "langchain-ollama>=1.0",
    "langchain-anthropic>=1.0",
    "langgraph-checkpoint-sqlite>=3.0",
    "jsonschema>=4.23",
    "pyyaml>=6.0",
    # Direct provider SDKs are retained only because the legacy
    # core/llm_router.py still imports them lazily. Remove them when that module
    # is retired, not before: an unused-looking dependency here is load-bearing.
    "ollama>=0.3",
    "anthropic>=0.34",
    # Integrations
    "python-telegram-bot>=21.0",
    "msgraph-sdk>=1.0",
    "google-api-python-client>=2.130",
    "google-auth-oauthlib>=1.2",
    "botbuilder-core>=4.15",
    "botbuilder-integration-aiohttp>=4.15",
    "watchdog>=4.0",
    # Persistence
    "sqlalchemy>=2.0",
    "chromadb>=0.5",
    # Interfaces
    "typer>=0.12",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    # Config + scheduling + HTTP
    "pydantic-settings>=2.4",
    "apscheduler>=3.10",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]
voice = [
    "faster-whisper>=1.0",
]

[project.scripts]
loop = "cli.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# A find directive rather than a hand-written list: the previous static list
# predated the `loop` package and silently shipped a wheel without it, which
# only shows up when the wheel is installed outside this checkout (O02).
# Patterns end in `*` so new subpackages are included without another edit.
include = [
    "loop*",
    "core*", "specialists*", "integrations*", "delivery*", "cli*", "web*",
    "config*",
]
exclude = ["tests*", "docs*", "scripts*", "data*"]

[tool.setuptools.package-data]
# The dashboard renders from these; a wheel without them imports fine and then
# fails at the first page request.
"web" = ["templates/*.html"]
"config" = [".env.example"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Pinned explicitly so `ruff check` means the same thing across ruff releases.
# BLE is included because the codebase relies on `# noqa: BLE001` to mark the
# deliberate broad excepts that keep background jobs and the dashboard alive.
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "BLE"]
# UP042: `str, Enum` is deliberate here. Switching to StrEnum changes what
# str(member) returns, and these values are persisted and logged.
ignore = ["UP042"]

[tool.ruff.lint.per-file-ignores]
# Tests use fakes and local imports inside test bodies by design.
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
